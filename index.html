<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b73">
  <meta name="application-name" content="Fischer's Quest">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/app-192.png">
  <link rel="apple-touch-icon" href="./icons/app-192.png">
  <title>Fischer's Quest</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f9ff;
      --panel: #ffffff;
      --ink: #142033;
      --muted: #5f6f86;
      --line: #d8e6f7;
      --accent: #2563eb;
      --accent-2: #0ea5e9;
      --accent-3: #38bdf8;
      --soft: #eef6ff;
      --shadow: 0 12px 34px rgba(20, 55, 98, .10);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(37, 99, 235, .13), transparent 340px),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a { color: inherit; }

    .shell {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 46px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 18px 0;
    }

    .brand {
      display: flex;
      gap: 13px;
      align-items: center;
      min-width: 0;
    }

    .brand-mark {
      width: 54px;
      aspect-ratio: 1;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #0f274f);
      box-shadow: var(--shadow);
      flex: 0 0 auto;
    }

    .brand-mark svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.65rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .header-tools {
      display: grid;
      gap: 10px;
      justify-items: end;
    }

    .random-play {
      min-width: 224px;
      min-height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .26);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 0 22px;
      font-size: 1.08rem;
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(37, 99, 235, .28);
    }

    .random-play svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .setup,
    .toolbar,
    .watch-area,
    .empty,
    .error-box {
      background: rgba(255, 255, 255, .94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .setup {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      margin: 8px 0 16px;
    }

    .setup.hidden,
    .watch-area.hidden,
    .empty.hidden,
    .error-box.hidden,
    .more-row.hidden {
      display: none;
    }

    .setup h2 {
      margin: 0 0 5px;
      font-size: 1rem;
    }

    .setup p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .key-row {
      display: flex;
      gap: 8px;
      min-width: min(570px, 100%);
    }

    .input,
    .select {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      outline: 0;
    }

    .input:focus,
    .select:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, .16);
    }

    .button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      padding: 0 14px;
      font-weight: 800;
      white-space: nowrap;
      text-decoration: none;
    }

    .button.secondary {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .button.accent {
      background: var(--accent);
    }

    .button:disabled {
      cursor: wait;
      opacity: .68;
    }

    .button svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(190px, 1.2fr) repeat(3, minmax(112px, .5fr)) auto;
      gap: 9px;
      align-items: center;
      padding: 12px;
      margin: 0 0 16px;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      stroke: var(--muted);
      fill: none;
      stroke-width: 2.2;
      pointer-events: none;
    }

    .search-wrap .input {
      padding-left: 38px;
    }

    .watch-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 0;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .player-panel {
      min-width: 0;
      border-right: 1px solid var(--line);
    }

    .player-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .player-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .player-meta {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: .86rem;
    }

    .player-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: flex-end;
    }

    .player-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 200px;
      border: 0;
      display: block;
      background: #101418;
    }

    body.focus-mode {
      background: #020617;
    }

    body.focus-mode .shell {
      width: min(1100px, 100%);
      padding: 0;
    }

    body.focus-mode header,
    body.focus-mode .setup,
    body.focus-mode .toolbar,
    body.focus-mode .rail,
    body.focus-mode .error-box,
    body.focus-mode .grid,
    body.focus-mode .empty,
    body.focus-mode .more-row {
      display: none;
    }

    body.focus-mode .watch-area {
      display: block;
      min-height: 100vh;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #020617;
      box-shadow: none;
    }

    body.focus-mode .player-panel {
      border: 0;
    }

    body.focus-mode .player-head {
      color: #e6eefb;
      border-color: #273b58;
      background: #0b1220;
    }

    body.focus-mode .player-meta {
      color: #aab9cf;
    }

    body.focus-mode .icon-button,
    body.focus-mode .icon-link {
      color: #e6eefb;
      border-color: #273b58;
      background: #111d2e;
    }

    body.focus-mode .icon-button.active {
      color: #7dd3fc;
      border-color: #2563eb;
      background: #182b45;
    }

    .rail {
      min-height: 0;
      background: #fbfcfa;
    }

    .rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .rail-title {
      margin: 0;
      font-size: .95rem;
    }

    .rail-list {
      display: grid;
      gap: 0;
      max-height: 610px;
      overflow: auto;
    }

    .rail-item {
      display: grid;
      grid-template-columns: 124px minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .rail-item:hover,
    .rail-item.active {
      background: var(--soft);
    }

    .rail-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 6px;
      background: #dfe5e1;
    }

    .rail-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rail-info {
      min-width: 0;
    }

    .rail-name {
      margin: 0;
      font-weight: 800;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .rail-date {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(20, 55, 98, .07);
      display: grid;
      grid-template-rows: auto 1fr;
      position: relative;
    }

    .card.active {
      outline: 3px solid rgba(37, 99, 235, .22);
    }

    .thumb-btn {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      padding: 0;
      background: #dfe5e1;
      overflow: hidden;
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .18s ease;
    }

    .thumb-btn:hover img {
      transform: scale(1.035);
    }

    .play-badge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: 42px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(37, 99, 235, .95);
      color: #fff;
      box-shadow: 0 7px 18px rgba(0, 0, 0, .22);
    }

    .play-badge svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transform: translateX(1px);
    }

    .watch-mark {
      position: absolute;
      top: 8px;
      left: 8px;
      border-radius: 999px;
      background: rgba(20, 32, 51, .85);
      color: #fff;
      padding: 4px 8px;
      font-size: .76rem;
      font-weight: 800;
    }

    .card-body {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 9px;
      padding: 12px;
    }

    .title {
      margin: 0;
      font-weight: 800;
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.84em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: .86rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      background: var(--soft);
      color: #3e4b55;
      padding: 3px 8px;
      font-size: .78rem;
      font-weight: 800;
    }

    .description {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: .91rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 4.1em;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .icon-link,
    .icon-button {
      width: 40px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
    }

    .icon-button.active {
      background: var(--soft);
      border-color: var(--accent-2);
      color: var(--accent);
    }

    .icon-button svg,
    .icon-link svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .empty,
    .error-box {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .error-box {
      margin: 0 0 16px;
      color: #8c1f1f;
      background: #fff5f3;
      border-color: #f0b5aa;
    }

    .more-row {
      display: flex;
      justify-content: center;
      padding: 22px 0 0;
    }

    .spinner {
      width: 17px;
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, .42);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: none;
    }

    .loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1220;
        --panel: #111d2e;
        --ink: #e6eefb;
        --muted: #aab9cf;
        --line: #273b58;
        --accent: #38bdf8;
        --accent-2: #2563eb;
        --accent-3: #7dd3fc;
        --soft: #182b45;
        --shadow: 0 12px 34px rgba(0, 0, 0, .32);
      }

      body {
        background: linear-gradient(180deg, rgba(56, 189, 248, .10), transparent 340px), var(--bg);
      }

      .setup,
      .toolbar,
      .watch-area,
      .empty,
      .error-box {
        background: rgba(17, 29, 46, .94);
      }

      .input,
      .select,
      .rail {
        background: #0d1828;
      }

      .tag {
        color: var(--ink);
      }

      .thumb-btn,
      .card .thumb-btn {
        background: #17263b;
      }

      .random-play {
        box-shadow: 0 12px 26px rgba(0, 0, 0, .34);
      }
    }

    @media (max-width: 1060px) {
      .toolbar {
        grid-template-columns: minmax(210px, 1fr) repeat(3, minmax(112px, 1fr)) auto;
      }
    }

    @media (max-width: 820px) {
      .shell {
        width: min(100% - 20px, 680px);
        padding-top: 10px;
      }

      header,
      .setup,
      .toolbar {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .header-tools {
        justify-items: stretch;
      }

      .random-play {
        width: 100%;
      }

      .key-row {
        min-width: 0;
        flex-direction: column;
      }

      .toolbar {
        position: static;
      }

      .toolbar .library-control {
        grid-column: auto;
      }

      .watch-area {
        grid-template-columns: 1fr;
      }

      .player-panel {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .player-head {
        grid-template-columns: 1fr;
      }

      .player-actions {
        justify-content: flex-start;
      }

      .rail-list {
        max-height: 48vh;
      }

      .rail-item {
        grid-template-columns: 132px minmax(0, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    [hidden] { display: none !important; }
    .header-tools { display: none; }
    h1 { font-size: 1.6rem; }
    .quest-summary { padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .quest-heading { margin: 0 0 12px; font-size: 1.1rem; }
    .quest-stats { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: end; }
    .quest-stat { display: grid; gap: 4px; }
    .quest-stat dt { color: var(--muted); font-size: .85rem; }
    .quest-stat dd { margin: 0; font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .quest-stats .button { margin-left: auto; min-height: 48px; }
    .quest-note { min-height: 1.4em; margin: 10px 0 0; color: var(--muted); font-size: .85rem; }
    .quest-list { margin: 14px 0 0; padding: 0; list-style: none; }
    .quest-row { display: grid; grid-template-columns: 26px 76px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .quest-row img { width: 76px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
    .quest-row-title { margin: 0; font-size: .9rem; overflow-wrap: anywhere; }
    .quest-row small { color: var(--muted); }
    .quest-row-tools { display: flex; gap: 4px; }
    .quest-row-tools button { width: 34px; height: 38px; }
    .selection-mark { position: absolute; right: 9px; top: 9px; min-width: 30px; height: 30px; display: grid; place-items: center; background: #fff; color: #142033; border-radius: 4px; font-weight: 900; box-shadow: 0 1px 4px #0006; }
    .card.selected { outline: 2px solid var(--accent); }
    .duration-badge { position: absolute; right: 8px; bottom: 8px; padding: 3px 5px; border-radius: 3px; color: #fff; background: #000d; font-size: .8rem; }
    .selection-button { width: 100%; min-height: 42px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font-weight: 700; }
    .candidate-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0 12px; scroll-margin-top: 72px; }
    .candidate-head h2 { margin: 0; font-size: 1rem; }
    .candidate-head span { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .candidate-actions { display: flex; align-items: center; gap: 12px; }
    .preset-panel { margin-bottom: 18px; }
    .preset-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 8px; }
    .preset-button { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); text-align: left; }
    .preset-button img { width: 80px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
    .preset-title { display: block; font-size: .9rem; font-weight: 700; overflow-wrap: anywhere; }
    .preset-button small { color: var(--muted); }
    .selection-dock { position: fixed; z-index: 20; inset-inline: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px #0002; }
    .selection-dock-inner { max-width: 1220px; margin: auto; display: flex; align-items: center; gap: 8px; }
    .selection-clock { display: grid; gap: 2px; margin-right: auto; color: var(--muted); font-size: .75rem; }
    .selection-clock strong { color: var(--ink); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .selection-summary { color: var(--ink); font-size: .75rem; }
    .selection-dock .icon-button { width: 44px; height: 44px; font-size: 1.25rem; flex-shrink: 0; }
    .selection-dock .button { min-height: 44px; }
    body.selecting-videos .shell { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
    .watch-area { display: block; }
    .player-panel { border: 0; }
    .player-frame { width: 100%; min-height: 200px; aspect-ratio: 16/9; border: 0; }
    .player-head { display: block; }
    .player-title { margin-top: 8px; }
    .player-progress { margin: 0; color: var(--accent); font-size: .9rem; font-weight: 800; }
    .player-message { color: var(--muted); padding: 8px 0; min-height: 1.5em; }
    .resume-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .preset-timer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .preset-timer label { font-size: .9rem; font-weight: 700; }
    .preset-timer .input { width: 76px; min-height: 42px; }
    .preset-timer output { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
    .timer-fields { display: flex; flex-wrap: wrap; gap: 8px 12px; }
    .timer-fields label { display: flex; align-items: center; gap: 6px; }
    .rest-screen { position: fixed; inset: 0; z-index: 100; display: grid; align-content: center; justify-items: center; gap: 12px; padding: 20px; background: #080b0f; color: #eef2f6; text-align: center; }
    .rest-screen h2, .rest-screen p { margin: 0; }
    .rest-remaining { font-size: 2.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    body.resting { overflow: hidden; }
    .cooldown { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 12px 0; border-block: 1px solid var(--line); }
    .cooldown h2 { margin: 0; font-size: .95rem; font-weight: 600; }
    .cooldown-time { margin: 0; font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .cooldown p:last-child { margin: 0; color: var(--muted); font-size: .8rem; }
    body.site-locked { color-scheme: dark; --ink: #eef2f6; --muted: #abb7c4; --panel: #111820; --line: #34414f; background: #000; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
    @media (max-width: 600px) {
      .candidate-head { scroll-margin-top: 8px; }

    @media (max-width: 720px), (orientation: landscape) and (max-height: 500px) {
      body.selecting-videos .shell { display: flex; flex-direction: column; padding-top: 4px; }
      body.selecting-videos .shell > header { display: none; }
      body.selecting-videos #catalog { display: contents; }
      #candidatePanel { order: -1; margin-bottom: 12px; }
      #candidateHead { padding: 6px 0 8px; scroll-margin-top: 0; }

      #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      #grid .card { cursor: pointer; }
      #grid .thumb-btn { max-height: clamp(24px, calc((100dvh - 300px - env(safe-area-inset-bottom, 0px)) / 3), 120px); }
      #grid .card-body { display: block; padding: 5px 7px; }
      #grid .card-body .meta, #grid .selection-button { display: none; }

    }
    @media (orientation: landscape) and (max-height: 500px) {
      #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>
  <main class="shell" id="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg></div>
        <div><h1>Fischer's Quest</h1></div>
      </div>
      <button class="button secondary" id="installApp" type="button" hidden>アプリをインストール</button>
    </header>
    <section class="cooldown" id="cooldown" hidden aria-labelledby="lockTitle">

      <p class="cooldown-time" id="lockRemaining">30:00</p>

    <section class="preset-panel" id="presetPanel" hidden aria-labelledby="presetHeading">

      <div class="preset-list" id="presetList"></div>
    </section>
    <section class="quest-summary" id="planning" aria-labelledby="questHeading">

      <div class="quest-stats">

        <dl class="quest-stat"><dt>合計時間</dt><dd id="totalDuration">0分</dd></dl>
        <dl class="quest-stat"><dt>今から見たら終了予定</dt><dd id="finishTime">--:--</dd></dl>
        <button class="button accent" id="startQuest" type="button" disabled>選択スタート</button>
      </div>
      <p class="quest-note" id="queueNote" role="status"></p>
      <button class="button secondary" id="retryDurations" type="button" hidden>動画時間を再取得</button>
      <ol class="quest-list" id="questList"></ol>
    </section>
    <section class="watch-area" id="watchArea" hidden aria-label="クエスト再生">
      <div class="player-panel">
        <div class="player-head">
          <p class="player-progress" id="playerProgress"></p>
          <h2 class="player-title" id="playerTitle"></h2>
          <div class="player-meta" id="playerMeta"></div>
        </div>
        <div id="playerMount"></div>
      </div>
      <div class="player-message" id="playerMessage" role="status"></div>
      <div class="resume-row">
        <button class="button" id="resumeQuest" type="button">再生を再開</button>
        <button class="button secondary" id="pauseQuest" type="button" hidden>一時停止</button>
        <button class="button secondary" id="seekForward" type="button" disabled>10秒進む</button>
        <button class="button secondary" id="retryPlayer" type="button" hidden>同じ動画を再読み込み</button>
        <button class="button secondary" id="nextVideo" type="button" hidden>次の動画へ</button>
        <button class="button secondary" id="endQuest" type="button" hidden>視聴を終了</button>
        <button class="button secondary" id="backToPresets" type="button" hidden>一覧に戻る</button>
      </div>
      <form class="preset-timer" id="presetTimer" hidden>
        <div class="timer-fields" id="presetTimerFields">
          <label>集中（分） <input class="input" id="presetTimerMinutes" type="number" inputmode="numeric" min="1" max="1440" step="1" value="30" required></label>
          <label>休憩（分） <input class="input" id="presetRestMinutes" type="number" inputmode="numeric" min="1" max="1440" step="1" value="5" required></label>
          <button class="button secondary" id="presetTimerStart" type="submit">セット</button>
        </div>
        <button class="button secondary" id="presetTimerCancel" type="button" hidden>解除</button>
        <output id="presetTimerRemaining" role="timer" hidden></output>
      </form>
      <section class="preset-panel" id="watchPresets" hidden aria-labelledby="watchPresetHeading">
        <div class="candidate-head"><h2 id="watchPresetHeading">定番の動画</h2></div>
        <div class="preset-list" id="watchPresetList"></div>

    <section class="error-box hidden" id="errorBox" role="alert"></section>
    <div id="catalog">
      <section class="setup" id="setup">
        <div><h2>YouTube Data API キー（任意）</h2><p>フィッシャーズの動画一覧を追加する場合に必要です。</p></div>
        <div class="key-row">
          <input class="input" id="apiKey" type="password" autocomplete="off" placeholder="APIキーを入力" aria-label="APIキー">
          <button class="button accent" id="saveKey" type="button">保存して取得</button>
        </div>
      </section>
      <section class="toolbar" aria-label="動画の絞り込み">
        <input class="input" id="query" type="search" placeholder="タイトル・説明で検索" aria-label="動画を検索">
        <select class="select" id="yearFrom" aria-label="開始年"><option value="2016">2016年から</option></select>
        <select class="select" id="yearTo" aria-label="終了年"><option value="all">最新まで</option></select>
        <select class="select library-control" id="libraryFilter" aria-label="視聴状態">
          <option value="all">すべて</option><option value="unwatched">未視聴</option><option value="watched">視聴済み</option>
          <option value="favorite">お気に入り</option><option value="later">あとで見る</option>
        </select>
        <button class="button" id="refresh" type="button">更新</button>
      </section>
      <section id="candidatePanel" hidden aria-label="動画選択">
        <div class="candidate-head" id="candidateHead">
          <h2 id="candidateHeading" tabindex="-1">動画候補</h2>
          <div class="candidate-actions">
            <span id="candidateCount">0本</span>
            <button class="icon-button" id="refreshCandidates" type="button" title="候補を入れ替える" aria-label="候補を入れ替える">↻</button>
          </div>
        </div>
        <section class="grid" id="grid" aria-label="ランダムな動画候補"></section>
        <section class="empty hidden" id="empty">表示できる動画がありません。</section>
      </section>
      <div class="selection-dock" id="selectionDock" hidden aria-label="動画選択の操作">
        <div class="selection-dock-inner">
          <span class="selection-clock">
            <span>残り時間 <strong id="selectionTime" role="timer">00:10</strong></span>
            <span class="selection-summary" id="selectionSummary"></span>
          </span>
          <button class="icon-button" id="refreshCandidatesBottom" type="button" title="候補を入れ替える" aria-label="下部の候補入れ替え">↻</button>
          <button class="button accent" id="playSelection" type="button" disabled>再生する</button>
        </div>
      </div>
    </div>
  </main>
  <section class="rest-screen" id="restScreen" role="dialog" aria-modal="true" aria-labelledby="restTitle" hidden>
    <h2 id="restTitle" tabindex="-1">休憩中</h2>
    <p class="rest-remaining" id="restRemaining" role="timer"></p>
    <p id="restUnlockTime"></p>
  </section>

  <script>

    const UPLOADS_PLAYLIST_ID = 'UUibEhpu5HP45-w7Bq1ZIulw';
    const MIN_DATE = new Date('2016-01-01T00:00:00Z');
    const STORAGE_KEY = 'fischers2017ViewerApiKey';
    const CACHE_KEY = 'fischers2017ViewerCacheV5';
    const STATE_KEY = 'fischers2017ViewerState';
    const QUEST_KEY = 'fischersQuestV1';
    const LOCK_KEY = 'fischersQuestLockUntilV1';
    const FOCUS_KEY = 'fischersFocusScheduleV1';
    const LEGACY_CACHE_KEYS = ['fischers2017ViewerCache', 'fischers2017ViewerCacheV2', 'fischers2017ViewerCacheV3', 'fischers2017ViewerCacheV4'];
    const CANDIDATE_COUNT = 5;
    const CACHE_DESCRIPTION_LIMIT = 120;
    const AUTO_REFRESH_MS = 12 * 60 * 60 * 1000;
    const COOLDOWN_MS = 30 * 60 * 1000;
    const SELECTION_MS = 10 * 1000;
    const TOKYO_CLOCK = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const DAILY_REST_START_MINUTE = 20 * 60 + 30;
    const DAILY_REST_END_MINUTE = DAILY_REST_START_MINUTE + 5;
    const PRESET_VIDEOS = new Map([
      ['VtKYjNo8IXI', 'ぼっち大学生だったシルクの学校生活を、もう一度...', 583],
      ['ZNWfZclu72c', '【本気】超集中モードで８時間の動画を編集するシルクロード', 779],
      ['ru_Bny5k-NY', '【仕事人】最速の編集者は何時間でメイン動画作り終えるのか！？', 852],
      ['80mAjV1XUUc', '【作業用】１時間半編集するんでシルクと一緒に頑張ろう。', 5403]
    ].map(([id, title, durationSeconds]) => [id, { id, title, durationSeconds, thumbnail: `https://i.ytimg.com/vi/${id}/hqdefault.jpg` }]));
    const els = Object.fromEntries([
      'app','planning','queueCount','totalDuration','finishTime','startQuest','queueNote',
      'retryDurations','questList','catalog','setup','apiKey','saveKey','refresh','query',
      'yearFrom','yearTo','libraryFilter','grid','empty','errorBox','candidateCount','refreshCandidates',
      'candidatePanel','candidateHead','candidateHeading','presetPanel','presetHead','presetHeading','presetList','selectionDock','selectionTime','selectionSummary','refreshCandidatesBottom','playSelection',
      'watchArea','playerProgress','playerTitle','playerMeta','playerMessage','resumeQuest',
      'pauseQuest','seekForward','retryPlayer','nextVideo','endQuest','backToPresets','watchPresets','watchPresetList','cooldown','lockTitle','lockRemaining','unlockTime',
      'presetTimer','presetTimerFields','presetTimerMinutes','presetRestMinutes','presetTimerCancel','presetTimerRemaining',
      'restScreen','restTitle','restRemaining','restUnlockTime'
    ].map(id => [id, document.getElementById(id)]));
    let allVideos = [];
    let candidateIds = [];
    let candidateFilterKey = '';
    const shownCandidateIds = new Set();
    let loading = false;
    let autoFetchTimer = 0;
    let lastCacheSavedAt = '';
    let archiveComplete = false;
    let archiveNextPageToken = '';
    let state = loadState();
    let quest = readQuest();
    let focusSchedule = readFocusSchedule();
    let restApplied = false;
    let selectionMessage = '';
    let durationBusy = false;
    let durationTimer = 0;
    const durationErrors = new Map();
    let player = null;
    let playerReady = false;
    let playerGeneration = 0;
    let playerAPI = null;
    let loadingPlayer = false;
    let hasPlayed = false;
    let handledEnd = false;
    let lastProgressSave = 0;

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
        return { favorites: new Set(saved.favorites || []), later: new Set(saved.later || []), watched: new Set(saved.watched || []) };
      } catch {
        return { favorites: new Set(), later: new Set(), watched: new Set() };
      }
    }
    function saveState() {
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify({
          favorites: [...state.favorites], later: [...state.later], watched: [...state.watched]
        }));
      } catch { showError('視聴状態を保存できません。ブラウザの保存容量を確認してください。'); }
    }
    function emptyQuest() {
      return { phase: 'planning', items: [], index: 0, checkpoint: 0, lockedUntil: 0, selectionUntil: 0, presetMode: false };
    }
    function readQuest() {
      try {
        const data = JSON.parse(localStorage.getItem(QUEST_KEY) || 'null');
        const lock = Math.max(Number(localStorage.getItem(LOCK_KEY)) || 0, Number(data?.lockedUntil) || 0);
        const lockedUntil = lock > Date.now() ? lock : 0;
        const items = (Array.isArray(data?.items) ? data.items : [])
          .filter(v => v && /^[A-Za-z0-9_-]{11}$/.test(v.id) && typeof v.title === 'string')
          .map(v => ({ ...v, durationSeconds: Number(v.durationSeconds) > 0 ? Number(v.durationSeconds) : PRESET_VIDEOS.get(v.id)?.durationSeconds || null }));
        const running = data?.phase === 'running' && items.length && items.every(v => v.durationSeconds > 0)
          && Number.isInteger(data.index) && data.index >= 0 && data.index < items.length;
        const presetMode = Boolean(running && data.presetMode === true && items.length === 1 && PRESET_VIDEOS.has(items[0].id));
        if (lockedUntil && !presetMode) return { ...emptyQuest(), phase: 'locked', lockedUntil };
        if (!data || data.phase === 'locked') return emptyQuest();
        const selectionUntil = Number(data.selectionUntil);
        return { ...emptyQuest(), items, phase: running ? 'running' : 'planning', lockedUntil,
          presetMode,
          selectionUntil: !running && Number.isFinite(selectionUntil) && selectionUntil > 0 ? selectionUntil : 0,
          index: running ? data.index : 0, checkpoint: running ? Math.max(0, Math.min(Number(data.checkpoint) || 0, items[data.index].durationSeconds)) : 0 };
      } catch { return emptyQuest(); }
    }
    function saveQuest() {
      try {
        localStorage.setItem(QUEST_KEY, JSON.stringify(quest));
        return true;
      } catch {
        showError('クエストを保存できません。ブラウザの保存容量を確認して再試行してください。');
        return false;
      }
    }
    function formatDuration(seconds) {
      if (!(seconds >= 0)) return '取得中';
      seconds = Math.round(seconds);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor(seconds % 3600 / 60);
      const rest = seconds % 60;
      return hours ? hours + '時間' + minutes + '分' + rest + '秒' : minutes + '分' + rest + '秒';
    }
    function clockTime(timestamp) {
      return new Intl.DateTimeFormat('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(timestamp);
    }
    function parseDuration(value) {
      const match = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$/.exec(value || '');
      if (!match) return null;
      const seconds = Number(match[1] || 0) * 86400 + Number(match[2] || 0) * 3600
        + Number(match[3] || 0) * 60 + Number(match[4] || 0);
      return seconds > 0 ? seconds : null;
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]));
    }
    function drawCandidates(redraw = false) {
      const filterKey = JSON.stringify([els.query.value.trim().toLowerCase(), els.yearFrom.value, els.yearTo.value, els.libraryFilter.value]);
      if (filterKey !== candidateFilterKey) {
        candidateFilterKey = filterKey;
        candidateIds = [];
        shownCandidateIds.clear();
      }
      const selected = new Set(quest.items.map(v => v.id));
      const pool = new Map(filteredVideos().filter(v => !selected.has(v.id)).map(v => [v.id, v]));
      candidateIds = redraw ? [] : candidateIds.filter(id => pool.has(id));
      const appendRandom = videos => {
        for (let index = videos.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [videos[index], videos[swapIndex]] = [videos[swapIndex], videos[index]];
        }
        for (const video of videos) {
          if (candidateIds.length >= CANDIDATE_COUNT) break;
          candidateIds.push(video.id);
        }
      };
      const eligible = [...pool.values()].filter(v => !candidateIds.includes(v.id));
      appendRandom(eligible.filter(v => !shownCandidateIds.has(v.id)));
      appendRandom(eligible.filter(v => shownCandidateIds.has(v.id)));
      candidateIds.forEach(id => shownCandidateIds.add(id));
      return candidateIds.map(id => pool.get(id));
    }
    function render(redrawCandidates = false) {
      if (quest.phase !== 'planning') { renderPhase(); return; }
      const videos = isSelecting() ? drawCandidates(redrawCandidates) : [];
      els.grid.innerHTML = videos.map(videoCard).join('');
      els.empty.classList.toggle('hidden', videos.length > 0);
      els.empty.textContent = filteredVideos().length ? 'この条件の動画はすべて選択済みです。' : 'この条件に合う動画がありません。';
      els.candidateCount.textContent = videos.length + '本';
      els.refreshCandidates.disabled = !videos.length;
      els.refreshCandidatesBottom.disabled = !videos.length;
      renderQueue();
    }
    function presetButton(video, currentId = '') {
      const current = video.id === currentId;
      const action = current ? '再生中の動画' : '再生';
      return '<button class="preset-button" type="button" data-select="' + video.id + '"'
        + (current ? ' aria-current="true"' : '')
        + (current ? ' disabled' : '') + '><img src="' + video.thumbnail + '" alt="">'
        + '<span><span class="preset-title">' + escapeHtml(video.title) + '</span><small>'
        + formatDuration(video.durationSeconds) + ' · ' + action + '</small></span></button>';
    }
    function videoCard(video) {
      const order = quest.items.findIndex(v => v.id === video.id);
      return '<article class="card ' + (order >= 0 ? 'selected' : '') + '" data-select="' + escapeHtml(video.id) + '">'
        + '<button class="thumb-btn" type="button" data-select="' + escapeHtml(video.id) + '" aria-pressed="' + (order >= 0) + '" aria-label="' + escapeHtml(video.title) + 'を選択">'
        + '<img src="' + escapeHtml(video.thumbnail) + '" alt="" loading="lazy">'
        + '<span class="selection-mark">' + (order >= 0 ? order + 1 : '+') + '</span>'
        + (video.durationSeconds ? '<span class="duration-badge">' + formatDuration(video.durationSeconds) + '</span>' : '') + '</button>'
        + '<div class="card-body"><h2 class="title">' + escapeHtml(video.title) + '</h2>'
        + '<div class="meta">' + formatDate(video.publishedAt) + (state.watched.has(video.id) ? ' · 視聴済み' : '') + '</div>'
        + '<button class="selection-button" type="button" data-select="' + escapeHtml(video.id) + '">' + (order >= 0 ? '選択済み · ' + (order + 1) + '番目' : '追加する') + '</button>'
        + '</div></article>';
    }
    function isSelecting() {
      return !isRestDue() && quest.phase === 'planning' && quest.selectionUntil > Date.now();
    }
    function renderSelectionControls(selecting) {
      els.presetPanel.hidden = !(quest.phase === 'locked' || (quest.phase === 'planning' && !quest.selectionUntil));
      els.candidatePanel.hidden = !selecting;
      els.selectionDock.hidden = !selecting;
      document.body.classList.toggle('selecting-videos', selecting);
      if (selecting) {
        const seconds = Math.ceil((quest.selectionUntil - Date.now()) / 1000);
        els.selectionTime.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
      }
    }
    function renderQueue(updateRows = true) {
      const selecting = isSelecting();
      renderSelectionControls(selecting);
      const missing = quest.items.filter(v => !(v.durationSeconds > 0));
      const total = quest.items.reduce((sum, v) => sum + (v.durationSeconds || 0), 0);
      els.queueCount.textContent = quest.items.length + '本';
      els.totalDuration.textContent = missing.length ? '時間を取得中' : formatDuration(total);
      els.selectionSummary.textContent = els.queueCount.textContent + (quest.items.length ? ' · ' + els.totalDuration.textContent : '');
      els.finishTime.textContent = quest.items.length && !missing.length ? clockTime(Date.now() + total * 1000) : '--:--';
      const hasError = quest.items.some(v => durationErrors.has(v.id));
      const ready = quest.items.length > 0 && !missing.length && !durationBusy;
      const canChoose = hasError || (!quest.selectionUntil && (quest.items.length || hasQueueCandidates()));
      els.startQuest.textContent = selecting ? '再生する' : !quest.selectionUntil ? '選択スタート' : hasError ? '選び直す' : '再生準備中';
      els.startQuest.disabled = quest.phase !== 'planning' || (selecting ? !ready : !canChoose);
      els.playSelection.disabled = !selecting || !ready;
      els.retryDurations.hidden = !hasError;
      els.queueNote.textContent = hasError ? '動画時間を取得できません。APIキーと再生可否を確認して再取得してください。'
        : !selecting && quest.selectionUntil ? '選択時間が終わりました。再生の準備をしています。'
        : missing.length ? '選択した動画の時間を取得しています。'
        : selectionMessage || (quest.items.length ? '終了予定は広告・一時停止・通信待ちを含まない目安です。視聴終了後は30分ロックされます。' : '');
      if (!updateRows) return;
      els.questList.innerHTML = quest.items.map((v, i) =>
        '<li class="quest-row"><span>' + (i + 1) + '</span><img src="' + escapeHtml(v.thumbnail) + '" alt="">'
        + '<div><p class="quest-row-title">' + escapeHtml(v.title) + '</p><small>' + (v.durationSeconds ? formatDuration(v.durationSeconds) : durationErrors.has(v.id) ? '取得できません' : '取得中') + '</small></div>'
        + '<div class="quest-row-tools">'
        + '<button class="icon-button" type="button" data-queue="up" data-id="' + v.id + '" title="前へ移動" aria-label="前へ移動"' + (!selecting || !i ? ' disabled' : '') + '>↑</button>'
        + '<button class="icon-button" type="button" data-queue="down" data-id="' + v.id + '" title="後ろへ移動" aria-label="後ろへ移動"' + (!selecting || i === quest.items.length - 1 ? ' disabled' : '') + '>↓</button>'
        + '<button class="icon-button" type="button" data-queue="remove" data-id="' + v.id + '" title="選択から削除" aria-label="選択から削除"' + (!selecting ? ' disabled' : '') + '>×</button></div></li>'
      ).join('');
    }
    function selectVideo(id) {
      if (!isSelecting()) return;

    async function apiGet(path, params) {

      const data = await response.json().catch(() => ({}));

        throw new Error(reason);

      return data;

            if (!videoId) continue;

        }

        archiveComplete = archiveComplete || reachedBeforeMinDate || !pageToken;
        if (archiveComplete) archiveNextPageToken = '';
        saveVideoCache(false);
        populateYears();
        render();
      } catch (error) {
        showError(`取得に失敗しました: ${error.message}`);
      } finally {
        setLoading(false);
      }
    }

    function normalizeVideo(video) {
      const description = String(video.description || '');
      return {
        id: String(video.id || ''),
        title: String(video.title || '無題'),
        description: description.slice(0, CACHE_DESCRIPTION_LIMIT),
        publishedAt: video.publishedAt,
        durationSeconds: Number(video.durationSeconds) > 0 ? Number(video.durationSeconds) : null,
        year: video.year || new Date(video.publishedAt).getUTCFullYear(),
        thumbnail: video.thumbnail || `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`,
        isShort: Boolean(video.isShort) || inferShort(video)
      };
    }

    function inferShort(video) {
      const text = `${video.title || ''}\n${video.description || ''}`.toLowerCase();
      return /#(?:shorts?|ショート(?:動画)?)(?![A-Za-z0-9_ぁ-んァ-ン一-龯])/i.test(text);
    }

    function dedupe(videos) {
      return Array.from(new Map(videos.map(video => [video.id, video])).values());
    }

    function populateYears() {
      const currentFrom = els.yearFrom.value || '2016';
      const years = allSelectableYears().sort((a, b) => b - a);
      const ascending = [...years].sort((a, b) => a - b);
      const yearOptions = ascending.length ? ascending : [2016];
      const currentTo = els.yearTo.value || 'all';
      els.yearFrom.innerHTML = yearOptions.map(year => `<option value="${year}">${year}年から</option>`).join('');
      els.yearTo.innerHTML = '<option value="all">最新まで</option>' + years.map(year => `<option value="${year}">${year}年まで</option>`).join('');
      els.yearFrom.value = [...els.yearFrom.options].some(option => option.value === currentFrom) ? currentFrom : String(yearOptions[0]);
      els.yearTo.value = [...els.yearTo.options].some(option => option.value === currentTo) ? currentTo : 'all';
    }

    function allSelectableYears() {
      const latestDataYear = Math.max(2016, ...availableVideos().map(video => video.year));
      const latestYear = Math.max(new Date().getFullYear(), latestDataYear);
      const years = [];
      for (let year = 2016; year <= latestYear; year += 1) {
        years.push(year);
      }
      return years;
    }

    function filteredVideos() {
      const query = els.query.value.trim().toLowerCase();
      const selectedFrom = Number(els.yearFrom.value || 2016);
      const selectedTo = els.yearTo.value === 'all' ? Infinity : Number(els.yearTo.value);
      const yearFrom = Math.min(selectedFrom, selectedTo);
      const yearTo = Math.max(selectedFrom, selectedTo);
      const library = els.libraryFilter.value;
      const videos = availableVideos().filter(video => {
        if (PRESET_VIDEOS.has(video.id)) return false;
        const yearMatch = video.year >= yearFrom && video.year <= yearTo;
        const queryMatch = !query || `${video.title}\n${video.description}`.toLowerCase().includes(query);
        const libraryMatch =
          library === 'all'
          || (library === 'unwatched' && !state.watched.has(video.id))
          || (library === 'watched' && state.watched.has(video.id))
          || (library === 'favorite' && state.favorites.has(video.id))
          || (library === 'later' && state.later.has(video.id));
        return yearMatch && queryMatch && libraryMatch;
      });

      return videos;
    }

    function availableVideos() {
      return allVideos.filter(video => !video.isShort);
    }


    function restoreCache() {
      try {
        clearLegacyCaches();
        const key = localStorage.getItem(STORAGE_KEY);
        if (key) { els.apiKey.value = key; els.setup.classList.add('hidden'); }
        const data = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (Array.isArray(data?.videos)) {
          lastCacheSavedAt = data.savedAt || '';
          archiveComplete = Boolean(data.archiveComplete);
          archiveNextPageToken = archiveComplete ? '' : String(data.nextPageToken || '');
          allVideos = data.videos.filter(v => new Date(v.publishedAt) >= MIN_DATE).map(normalizeVideo);
        }
      } catch { showError('保存データの一部を読み込めませんでした。'); }
      populateYears();
      renderPhase();
      if (!finishSelectionIfDue()) render();
      if (quest.phase === 'planning') { scheduleAutoFetch(); scheduleDurations(); }
    }
    function shouldAutoFetch() {
      return quest.phase === 'planning' && !loading && Boolean(getApiKey())
        && (!allVideos.length || !archiveComplete || !lastCacheSavedAt || Date.now() - new Date(lastCacheSavedAt).getTime() > AUTO_REFRESH_MS);
    }
    function scheduleAutoFetch(delay = 500) {
      window.clearTimeout(autoFetchTimer);
      if (shouldAutoFetch()) autoFetchTimer = window.setTimeout(fetchVideos, delay);
    }
    function selectFromButton(event) {
      const target = event.target.closest('[data-select]');
      if (target) selectVideo(target.dataset.select);
    }
    els.grid.addEventListener('click', selectFromButton);
    els.presetList.addEventListener('click', event => {
      const target = event.target.closest('[data-select]');
      if (target) playPreset(target.dataset.select);
    });
    els.watchPresetList.addEventListener('click', event => {
      const target = event.target.closest('[data-select]');
      if (target) playPreset(target.dataset.select);
    });
    els.questList.addEventListener('click', event => {
      const target = event.target.closest('[data-queue]');
      if (target) changeQueue(target.dataset.id, target.dataset.queue);
    });
    els.startQuest.addEventListener('click', () => isSelecting() ? startQuest() : beginSelection());
    els.playSelection.addEventListener('click', startQuest);
    els.resumeQuest.addEventListener('click', resumeQuest);
    els.pauseQuest.addEventListener('click', () => { if (currentVideoMatches()) player.pauseVideo(); });
    els.seekForward.addEventListener('click', seekForward);
    els.nextVideo.addEventListener('click', advanceQuest);
    els.endQuest.addEventListener('click', endQuest);
    els.backToPresets.addEventListener('click', backToPresets);
    els.presetTimer.addEventListener('submit', event => {
      event.preventDefault();
      setPresetTimer(Number(els.presetTimerMinutes.value), Number(els.presetRestMinutes.value));
    });
    els.presetTimerCancel.addEventListener('click', cancelPresetTimer);
    els.retryPlayer.addEventListener('click', () => {
      if (isRestDue() || quest.phase !== 'running') return;
      destroyPlayer();
      resumeQuest();
    });
    els.retryDurations.addEventListener('click', () => { durationErrors.clear(); loadDurations(); });
    els.saveKey.addEventListener('click', () => {
      saveApiKey();
      durationErrors.clear();
      loadDurations();
      fetchVideos();
    });
    els.refresh.addEventListener('click', fetchVideos);
    [els.query, els.yearFrom, els.yearTo, els.libraryFilter].forEach(el => {
      el.addEventListener(el === els.query ? 'input' : 'change', () => render(true));
    });
    function redrawCandidateList() {
      if (!isSelecting()) return;
      render(true);
      els.candidateHead.scrollIntoView({ behavior: 'auto', block: 'start' });
    }
    els.refreshCandidates.addEventListener('click', redrawCandidateList);
    els.refreshCandidatesBottom.addEventListener('click', redrawCandidateList);
    window.addEventListener('pagehide', () => { if (quest.phase === 'running') { recordProgress(); saveQuest(); } });
    window.addEventListener('storage', event => {
      if (event.key === FOCUS_KEY) {
        focusSchedule = readFocusSchedule();
        updateRest();
        return;
      }
      if (event.key !== QUEST_KEY && event.key !== LOCK_KEY) return;
      const next = readQuest();
      if (next.lockedUntil && isPresetPlayback()) {
        quest.lockedUntil = Math.max(quest.lockedUntil, next.lockedUntil);
        renderCooldown();
      } else if (next.lockedUntil) {
        quest = { ...emptyQuest(), phase: 'locked', lockedUntil: next.lockedUntil };
        destroyPlayer();
        renderPhase();
      } else if (quest.phase === 'planning' && next.phase === 'running' && !next.presetMode) {
        quest = next;
        destroyPlayer();
        renderPhase();
      } else if (next.phase === 'planning' && quest.phase === 'planning') {
        quest = next;
        render();
      }
    });
    document.addEventListener('visibilitychange', tick);
    els.presetList.innerHTML = [...PRESET_VIDEOS.values()].map(video => presetButton(video)).join('');
    renderRest(0);
    restoreCache();
    updateRest();
    window.setInterval(tick, 1000);

  </script>
  <script src="./pwa.js" defer></script>
</body>
</html>
