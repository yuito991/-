<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fischer's Quest</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f9ff;
      --panel: #ffffff;
      --ink: #142033;
      --muted: #5f6f86;
      --line: #d8e6f7;
      --accent: #2563eb;
      --accent-2: #0ea5e9;
      --accent-3: #38bdf8;
      --soft: #eef6ff;
      --shadow: 0 12px 34px rgba(20, 55, 98, .10);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(37, 99, 235, .13), transparent 340px),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a { color: inherit; }

    .shell {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 46px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 18px 0;
    }

    .brand {
      display: flex;
      gap: 13px;
      align-items: center;
      min-width: 0;
    }

    .brand-mark {
      width: 54px;
      aspect-ratio: 1;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #0f274f);
      box-shadow: var(--shadow);
      flex: 0 0 auto;
    }

    .brand-mark svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.65rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .header-tools {
      display: grid;
      gap: 10px;
      justify-items: end;
    }

    .random-play {
      min-width: 224px;
      min-height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .26);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 0 22px;
      font-size: 1.08rem;
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(37, 99, 235, .28);
    }

    .random-play svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .setup,
    .toolbar,
    .watch-area,
    .empty,
    .error-box {
      background: rgba(255, 255, 255, .94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .setup {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      margin: 8px 0 16px;
    }

    .setup.hidden,
    .watch-area.hidden,
    .empty.hidden,
    .error-box.hidden,
    .more-row.hidden {
      display: none;
    }

    .setup h2 {
      margin: 0 0 5px;
      font-size: 1rem;
    }

    .setup p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .key-row {
      display: flex;
      gap: 8px;
      min-width: min(570px, 100%);
    }

    .input,
    .select {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      outline: 0;
    }

    .input:focus,
    .select:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, .16);
    }

    .button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      padding: 0 14px;
      font-weight: 800;
      white-space: nowrap;
      text-decoration: none;
    }

    .button.secondary {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .button.accent {
      background: var(--accent);
    }

    .button:disabled {
      cursor: wait;
      opacity: .68;
    }

    .button svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(190px, 1.2fr) repeat(4, minmax(112px, .5fr)) auto;
      gap: 9px;
      align-items: center;
      padding: 12px;
      margin: 0 0 16px;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      stroke: var(--muted);
      fill: none;
      stroke-width: 2.2;
      pointer-events: none;
    }

    .search-wrap .input {
      padding-left: 38px;
    }

    .watch-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: 0;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .player-panel {
      min-width: 0;
      border-right: 1px solid var(--line);
    }

    .player-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .player-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .player-meta {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: .86rem;
    }

    .player-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: flex-end;
    }

    .player-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 200px;
      border: 0;
      display: block;
      background: #101418;
    }

    body.focus-mode {
      background: #020617;
    }

    body.focus-mode .shell {
      width: min(1100px, 100%);
      padding: 0;
    }

    body.focus-mode header,
    body.focus-mode .setup,
    body.focus-mode .toolbar,
    body.focus-mode .rail,
    body.focus-mode .error-box,
    body.focus-mode .grid,
    body.focus-mode .empty,
    body.focus-mode .more-row {
      display: none;
    }

    body.focus-mode .watch-area {
      display: block;
      min-height: 100vh;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #020617;
      box-shadow: none;
    }

    body.focus-mode .player-panel {
      border: 0;
    }

    body.focus-mode .player-head {
      color: #e6eefb;
      border-color: #273b58;
      background: #0b1220;
    }

    body.focus-mode .player-meta {
      color: #aab9cf;
    }

    body.focus-mode .icon-button,
    body.focus-mode .icon-link {
      color: #e6eefb;
      border-color: #273b58;
      background: #111d2e;
    }

    body.focus-mode .icon-button.active {
      color: #7dd3fc;
      border-color: #2563eb;
      background: #182b45;
    }

    .rail {
      min-height: 0;
      background: #fbfcfa;
    }

    .rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .rail-title {
      margin: 0;
      font-size: .95rem;
    }

    .rail-list {
      display: grid;
      gap: 0;
      max-height: 610px;
      overflow: auto;
    }

    .rail-item {
      display: grid;
      grid-template-columns: 124px minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .rail-item:hover,
    .rail-item.active {
      background: var(--soft);
    }

    .rail-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 6px;
      background: #dfe5e1;
    }

    .rail-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rail-info {
      min-width: 0;
    }

    .rail-name {
      margin: 0;
      font-weight: 800;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .rail-date {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(20, 55, 98, .07);
      display: grid;
      grid-template-rows: auto 1fr;
      position: relative;
    }

    .card.active {
      outline: 3px solid rgba(37, 99, 235, .22);
    }

    .thumb-btn {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      padding: 0;
      background: #dfe5e1;
      overflow: hidden;
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .18s ease;
    }

    .thumb-btn:hover img {
      transform: scale(1.035);
    }

    .play-badge {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: 42px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(37, 99, 235, .95);
      color: #fff;
      box-shadow: 0 7px 18px rgba(0, 0, 0, .22);
    }

    .play-badge svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transform: translateX(1px);
    }

    .watch-mark {
      position: absolute;
      top: 8px;
      left: 8px;
      border-radius: 999px;
      background: rgba(20, 32, 51, .85);
      color: #fff;
      padding: 4px 8px;
      font-size: .76rem;
      font-weight: 800;
    }

    .card-body {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 9px;
      padding: 12px;
    }

    .title {
      margin: 0;
      font-weight: 800;
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.84em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: .86rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      background: var(--soft);
      color: #3e4b55;
      padding: 3px 8px;
      font-size: .78rem;
      font-weight: 800;
    }

    .description {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: .91rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 4.1em;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .icon-link,
    .icon-button {
      width: 40px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
    }

    .icon-button.active {
      background: var(--soft);
      border-color: var(--accent-2);
      color: var(--accent);
    }

    .icon-button svg,
    .icon-link svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .empty,
    .error-box {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .error-box {
      margin: 0 0 16px;
      color: #8c1f1f;
      background: #fff5f3;
      border-color: #f0b5aa;
    }

    .more-row {
      display: flex;
      justify-content: center;
      padding: 22px 0 0;
    }

    .spinner {
      width: 17px;
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, .42);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: none;
    }

    .loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1220;
        --panel: #111d2e;
        --ink: #e6eefb;
        --muted: #aab9cf;
        --line: #273b58;
        --accent: #38bdf8;
        --accent-2: #2563eb;
        --accent-3: #7dd3fc;
        --soft: #182b45;
        --shadow: 0 12px 34px rgba(0, 0, 0, .32);
      }

      body {
        background: linear-gradient(180deg, rgba(56, 189, 248, .10), transparent 340px), var(--bg);
      }

      .setup,
      .toolbar,
      .watch-area,
      .empty,
      .error-box {
        background: rgba(17, 29, 46, .94);
      }

      .input,
      .select,
      .rail {
        background: #0d1828;
      }

      .tag {
        color: var(--ink);
      }

      .thumb-btn,
      .card .thumb-btn {
        background: #17263b;
      }

      .random-play {
        box-shadow: 0 12px 26px rgba(0, 0, 0, .34);
      }
    }

    @media (max-width: 1060px) {
      .toolbar {
        grid-template-columns: minmax(210px, 1fr) repeat(4, minmax(112px, 1fr)) auto;
      }

      .toolbar .library-control {
        grid-column: 2 / span 2;
      }
    }

    @media (max-width: 820px) {
      .shell {
        width: min(100% - 20px, 680px);
        padding-top: 10px;
      }

      header,
      .setup,
      .toolbar {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .header-tools {
        justify-items: stretch;
      }

      .random-play {
        width: 100%;
      }

      .key-row {
        min-width: 0;
        flex-direction: column;
      }

      .toolbar {
        position: static;
      }

      .toolbar .library-control {
        grid-column: auto;
      }

      .watch-area {
        grid-template-columns: 1fr;
      }

      .player-panel {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .player-head {
        grid-template-columns: 1fr;
      }

      .player-actions {
        justify-content: flex-start;
      }

      .rail-list {
        max-height: 48vh;
      }

      .rail-item {
        grid-template-columns: 132px minmax(0, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    [hidden] { display: none !important; }
    .header-tools { display: none; }
    h1 { font-size: 1.6rem; }
    .quest-summary { padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .quest-heading { margin: 0 0 12px; font-size: 1.1rem; }
    .quest-stats { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: end; }
    .quest-stat { display: grid; gap: 4px; }
    .quest-stat dt { color: var(--muted); font-size: .85rem; }
    .quest-stat dd { margin: 0; font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .quest-stats .button { margin-left: auto; min-height: 48px; }
    .quest-note { min-height: 1.4em; margin: 10px 0 0; color: var(--muted); font-size: .85rem; }
    .quest-list { margin: 14px 0 0; padding: 0; list-style: none; }
    .quest-row { display: grid; grid-template-columns: 26px 76px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .quest-row img { width: 76px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
    .quest-row-title { margin: 0; font-size: .9rem; overflow-wrap: anywhere; }
    .quest-row small { color: var(--muted); }
    .quest-row-tools { display: flex; gap: 4px; }
    .quest-row-tools button { width: 34px; height: 38px; }
    .selection-mark { position: absolute; right: 9px; top: 9px; min-width: 30px; height: 30px; display: grid; place-items: center; background: #fff; color: #142033; border-radius: 4px; font-weight: 900; box-shadow: 0 1px 4px #0006; }
    .card.selected { outline: 2px solid var(--accent); }
    .duration-badge { position: absolute; right: 8px; bottom: 8px; padding: 3px 5px; border-radius: 3px; color: #fff; background: #000d; font-size: .8rem; }
    .selection-button { width: 100%; min-height: 42px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font-weight: 700; }
    .watch-area { display: block; }
    .player-panel { border: 0; }
    .player-frame { width: 100%; min-height: 200px; aspect-ratio: 16/9; border: 0; }
    .player-head { display: block; }
    .player-title { margin-top: 8px; }
    .player-progress { margin: 0; color: var(--accent); font-size: .9rem; font-weight: 800; }
    .player-message { color: var(--muted); padding: 8px 0; min-height: 1.5em; }
    .resume-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .cooldown { position: fixed; inset: 0; z-index: 100; display: grid; align-content: center; justify-items: center; gap: 18px; padding: 24px; background: #000; color: #eee; text-align: center; }
    .cooldown h2 { font-size: 1.2rem; margin: 0; font-weight: 600; }
    .cooldown-time { font-size: 3rem; font-variant-numeric: tabular-nums; margin: 0; }
    .cooldown p:last-child { margin: 0; color: #999; font-size: .9rem; }
    body.site-locked { background: #000; }
    body.site-locked .shell { display: none; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
    @media (max-width: 600px) {
      .quest-stats { gap: 12px 20px; }
      .quest-stats .button { width: 100%; margin-left: 0; }
      .quest-row { grid-template-columns: 20px 56px minmax(0,1fr); gap: 7px; }
      .quest-row img { width: 56px; }
      .quest-row-tools { grid-column: 3; justify-content: end; }
      .quest-stat dd { font-size: 1.08rem; }
    }
  </style>
</head>

<body>
  <main class="shell" id="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg></div>
        <div><h1>Fischer's Quest</h1></div>
      </div>
    </header>
    <section class="quest-summary" id="planning" aria-labelledby="questHeading">
      <h2 class="quest-heading" id="questHeading">今回の動画</h2>
      <div class="quest-stats">
        <dl class="quest-stat"><dt>選択した動画</dt><dd id="queueCount">0本</dd></dl>
        <dl class="quest-stat"><dt>合計時間</dt><dd id="totalDuration">0分</dd></dl>
        <dl class="quest-stat"><dt>今から見たら終了予定</dt><dd id="finishTime">--:--</dd></dl>
        <button class="button accent" id="startQuest" type="button" disabled>クエスト開始</button>
      </div>
      <p class="quest-note" id="queueNote" role="status"></p>
      <button class="button secondary" id="retryDurations" type="button" hidden>動画時間を再取得</button>
      <ol class="quest-list" id="questList"></ol>
    </section>
    <section class="watch-area" id="watchArea" hidden aria-label="クエスト再生">
      <div class="player-panel">
        <div class="player-head">
          <p class="player-progress" id="playerProgress"></p>
          <h2 class="player-title" id="playerTitle"></h2>
          <div class="player-meta" id="playerMeta"></div>
        </div>
        <div id="playerMount"></div>
      </div>
      <div class="player-message" id="playerMessage" role="status"></div>
      <div class="resume-row">
        <button class="button" id="resumeQuest" type="button">再生を再開</button>
        <button class="button secondary" id="retryPlayer" type="button" hidden>同じ動画を再読み込み</button>
      </div>
    </section>
    <section class="error-box hidden" id="errorBox" role="alert"></section>
    <div id="catalog">
      <section class="setup" id="setup">
        <div><h2>YouTube Data API キー</h2><p>キーはこのブラウザ内に保存されます。</p></div>
        <div class="key-row">
          <input class="input" id="apiKey" type="password" autocomplete="off" placeholder="APIキーを入力" aria-label="APIキー">
          <button class="button accent" id="saveKey" type="button">保存して取得</button>
        </div>
      </section>
      <section class="toolbar" aria-label="動画の絞り込み">
        <input class="input" id="query" type="search" placeholder="タイトル・説明で検索" aria-label="動画を検索">
        <select class="select" id="yearFrom" aria-label="開始年"><option value="2016">2016年から</option></select>
        <select class="select" id="yearTo" aria-label="終了年"><option value="all">最新まで</option></select>
        <select class="select" id="sort" aria-label="並び順">
          <option value="new">新しい順</option><option value="old">古い順</option>
          <option value="title">タイトル順</option><option value="unwatched">未視聴優先</option>
        </select>
        <select class="select library-control" id="libraryFilter" aria-label="視聴状態">
          <option value="all">すべて</option><option value="unwatched">未視聴</option><option value="watched">視聴済み</option>
          <option value="favorite">お気に入り</option><option value="later">あとで見る</option>
        </select>
        <button class="button" id="refresh" type="button">更新</button>
      </section>
      <section class="grid" id="grid" aria-label="動画一覧"></section>
      <section class="empty hidden" id="empty">表示できる動画がありません。</section>
      <div class="more-row hidden" id="moreRow"><button class="button secondary" id="loadMore" type="button">さらに表示</button></div>
    </div>
  </main>
  <section class="cooldown" id="cooldown" hidden role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <h2 id="lockTitle" tabindex="-1">視聴は終了しました</h2>
    <p class="cooldown-time" id="lockRemaining">30:00</p>
    <p id="unlockTime"></p>
  </section>

  <script>

    const UPLOADS_PLAYLIST_ID = 'UUibEhpu5HP45-w7Bq1ZIulw';
    const MIN_DATE = new Date('2016-01-01T00:00:00Z');
    const STORAGE_KEY = 'fischers2017ViewerApiKey';
    const CACHE_KEY = 'fischers2017ViewerCacheV5';
    const STATE_KEY = 'fischers2017ViewerState';
    const QUEST_KEY = 'fischersQuestV1';
    const LOCK_KEY = 'fischersQuestLockUntilV1';
    const LEGACY_CACHE_KEYS = ['fischers2017ViewerCache', 'fischers2017ViewerCacheV2', 'fischers2017ViewerCacheV3', 'fischers2017ViewerCacheV4'];
    const PAGE_SIZE = 36;
    const CACHE_DESCRIPTION_LIMIT = 120;
    const AUTO_REFRESH_MS = 12 * 60 * 60 * 1000;
    const COOLDOWN_MS = 30 * 60 * 1000;
    const els = Object.fromEntries([
      'app','planning','queueCount','totalDuration','finishTime','startQuest','queueNote',
      'retryDurations','questList','catalog','setup','apiKey','saveKey','refresh','query',
      'yearFrom','yearTo','sort','libraryFilter','grid','empty','errorBox','moreRow','loadMore',
      'watchArea','playerProgress','playerTitle','playerMeta','playerMessage','resumeQuest',
      'retryPlayer','cooldown','lockTitle','lockRemaining','unlockTime'
    ].map(id => [id, document.getElementById(id)]));
    let allVideos = [];
    let visibleLimit = PAGE_SIZE;
    let loading = false;
    let autoFetchTimer = 0;
    let lastCacheSavedAt = '';
    let archiveComplete = false;
    let archiveNextPageToken = '';
    let state = loadState();
    let quest = readQuest();
    let durationBusy = false;
    let durationTimer = 0;
    const durationErrors = new Map();
    let player = null;
    let playerReady = false;
    let playerAPI = null;
    let loadingPlayer = false;
    let sampleTime = 0;
    let samplePosition = 0;
    let hasPlayed = false;
    let handledEnd = false;
    let lastProgressSave = 0;

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
        return { favorites: new Set(saved.favorites || []), later: new Set(saved.later || []), watched: new Set(saved.watched || []) };
      } catch {
        return { favorites: new Set(), later: new Set(), watched: new Set() };
      }
    }
    function saveState() {
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify({
          favorites: [...state.favorites], later: [...state.later], watched: [...state.watched]
        }));
      } catch { showError('視聴状態を保存できません。ブラウザの保存容量を確認してください。'); }
    }
    function emptyQuest() {
      return { phase: 'planning', items: [], index: 0, checkpoint: 0, lockedUntil: 0 };
    }
    function readQuest() {
      try {
        const data = JSON.parse(localStorage.getItem(QUEST_KEY) || 'null');
        const lock = Math.max(Number(localStorage.getItem(LOCK_KEY)) || 0, Number(data?.lockedUntil) || 0);
        if (lock > Date.now()) return { ...emptyQuest(), phase: 'locked', lockedUntil: lock };
        if (!data || data.phase === 'locked') return emptyQuest();
        const items = (Array.isArray(data.items) ? data.items : [])
          .filter(v => /^[A-Za-z0-9_-]{11}$/.test(v.id) && typeof v.title === 'string')
          .map(v => ({ ...v, durationSeconds: Number(v.durationSeconds) > 0 ? Number(v.durationSeconds) : null }));
        const running = data.phase === 'running' && items.length && items.every(v => v.durationSeconds > 0)
          && Number.isInteger(data.index) && data.index >= 0 && data.index < items.length;
        return { ...emptyQuest(), items, phase: running ? 'running' : 'planning',
          index: running ? data.index : 0, checkpoint: running ? Math.max(0, Math.min(Number(data.checkpoint) || 0, items[data.index].durationSeconds)) : 0 };
      } catch { return emptyQuest(); }
    }
    function saveQuest() {
      try {
        localStorage.setItem(QUEST_KEY, JSON.stringify(quest));
        return true;
      } catch {
        showError('クエストを保存できません。ブラウザの保存容量を確認して再試行してください。');
        return false;
      }
    }
    function formatDuration(seconds) {
      if (!(seconds >= 0)) return '取得中';
      seconds = Math.round(seconds);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor(seconds % 3600 / 60);
      const rest = seconds % 60;
      return hours ? hours + '時間' + minutes + '分' + rest + '秒' : minutes + '分' + rest + '秒';
    }
    function clockTime(timestamp) {
      return new Intl.DateTimeFormat('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(timestamp);
    }
    function parseDuration(value) {
      const match = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$/.exec(value || '');
      if (!match) return null;
      const seconds = Number(match[1] || 0) * 86400 + Number(match[2] || 0) * 3600
        + Number(match[3] || 0) * 60 + Number(match[4] || 0);
      return seconds > 0 ? seconds : null;
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]));
    }
    function render() {
      if (quest.phase !== 'planning') { renderPhase(); return; }
      const videos = filteredVideos();
      els.grid.innerHTML = videos.slice(0, visibleLimit).map(videoCard).join('');
      els.empty.classList.toggle('hidden', videos.length > 0);
      els.moreRow.classList.toggle('hidden', visibleLimit >= videos.length);
      renderQueue();
    }
    function videoCard(video) {
      const order = quest.items.findIndex(v => v.id === video.id);
      return '<article class="card ' + (order >= 0 ? 'selected' : '') + '">'
        + '<button class="thumb-btn" type="button" data-select="' + escapeHtml(video.id) + '" aria-pressed="' + (order >= 0) + '" aria-label="' + escapeHtml(video.title) + 'を選択">'
        + '<img src="' + escapeHtml(video.thumbnail) + '" alt="" loading="lazy">'
        + '<span class="selection-mark">' + (order >= 0 ? order + 1 : '+') + '</span>'
        + (video.durationSeconds ? '<span class="duration-badge">' + formatDuration(video.durationSeconds) + '</span>' : '') + '</button>'
        + '<div class="card-body"><h2 class="title">' + escapeHtml(video.title) + '</h2>'
        + '<div class="meta">' + formatDate(video.publishedAt) + (state.watched.has(video.id) ? ' · 視聴済み' : '') + '</div>'
        + '<button class="selection-button" type="button" data-select="' + escapeHtml(video.id) + '">' + (order >= 0 ? '選択済み · ' + (order + 1) + '番目' : '追加する') + '</button>'
        + '</div></article>';
    }
    function renderQueue() {
      const missing = quest.items.filter(v => !(v.durationSeconds > 0));
      const total = quest.items.reduce((sum, v) => sum + (v.durationSeconds || 0), 0);
      els.queueCount.textContent = quest.items.length + '本';
      els.totalDuration.textContent = missing.length ? '時間を取得中' : formatDuration(total);
      els.finishTime.textContent = quest.items.length && !missing.length ? clockTime(Date.now() + total * 1000) : '--:--';
      els.startQuest.disabled = !quest.items.length || missing.length > 0 || durationBusy || quest.phase !== 'planning';
      const hasError = quest.items.some(v => durationErrors.has(v.id));
      els.retryDurations.hidden = !hasError;
      els.queueNote.textContent = hasError ? '動画時間を取得できません。APIキーと再生可否を確認して再取得してください。'
        : missing.length ? '選択した動画の時間を取得しています。'
        : quest.items.length ? '終了予定は広告・一時停止・通信待ちを含まない目安です。視聴終了後は30分ロックされます。' : '';
      els.questList.innerHTML = quest.items.map((v, i) =>
        '<li class="quest-row"><span>' + (i + 1) + '</span><img src="' + escapeHtml(v.thumbnail) + '" alt="">'
        + '<div><p class="quest-row-title">' + escapeHtml(v.title) + '</p><small>' + (v.durationSeconds ? formatDuration(v.durationSeconds) : durationErrors.has(v.id) ? '取得できません' : '取得中') + '</small></div>'
        + '<div class="quest-row-tools">'
        + '<button class="icon-button" type="button" data-queue="up" data-id="' + v.id + '" title="前へ移動" aria-label="前へ移動"' + (!i ? ' disabled' : '') + '>↑</button>'
        + '<button class="icon-button" type="button" data-queue="down" data-id="' + v.id + '" title="後ろへ移動" aria-label="後ろへ移動"' + (i === quest.items.length - 1 ? ' disabled' : '') + '>↓</button>'
        + '<button class="icon-button" type="button" data-queue="remove" data-id="' + v.id + '" title="選択から削除" aria-label="選択から削除">×</button></div></li>'
      ).join('');
    }
    function selectVideo(id) {
      if (quest.phase !== 'planning') return;
      const index = quest.items.findIndex(v => v.id === id);
      if (index >= 0) quest.items.splice(index, 1);
      else {
        const video = allVideos.find(v => v.id === id && !v.isShort);
        if (!video) return;
        quest.items.push({ ...video });
      }
      saveQuest();
      render();
      scheduleDurations();
    }
    function changeQueue(id, action) {
      if (quest.phase !== 'planning') return;
      const index = quest.items.findIndex(v => v.id === id);
      if (index < 0) return;
      if (action === 'remove') quest.items.splice(index, 1);
      else {
        const next = action === 'up' ? index - 1 : index + 1;
        if (next < 0 || next >= quest.items.length) return;
        [quest.items[index], quest.items[next]] = [quest.items[next], quest.items[index]];
      }
      saveQuest();
      render();
    }
    function scheduleDurations() {
      window.clearTimeout(durationTimer);
      if (quest.phase === 'planning') durationTimer = window.setTimeout(loadDurations, 200);
    }
    async function loadDurations() {
      if (durationBusy || quest.phase !== 'planning') return;
      const missing = quest.items.filter(v => !v.durationSeconds && !durationErrors.has(v.id));
      if (!missing.length) return;
      const key = getApiKey();
      if (!key) {
        missing.forEach(v => durationErrors.set(v.id, true));
        els.setup.classList.remove('hidden');
        renderQueue();
        return;
      }
      durationBusy = true;
      renderQueue();
      try {
        for (let offset = 0; offset < missing.length; offset += 50) {
          const batch = missing.slice(offset, offset + 50);
          const data = await apiGet('videos', { part:'contentDetails,status,snippet', id:batch.map(v => v.id).join(','), key });
          const found = new Map((data.items || []).map(v => [v.id, v]));
          batch.forEach(video => {
            const details = found.get(video.id);
            const seconds = parseDuration(details?.contentDetails?.duration);
            const usable = seconds && details?.status?.embeddable !== false
              && details?.snippet?.liveBroadcastContent !== 'live' && details?.snippet?.liveBroadcastContent !== 'upcoming';
            if (!usable) { durationErrors.set(video.id, true); return; }
            [allVideos, quest.items].forEach(list => {
              const item = list.find(v => v.id === video.id);
              if (item) item.durationSeconds = seconds;
            });
          });
          saveVideoCache(false);
          saveQuest();
        }
      } catch (error) {
        missing.filter(v => !v.durationSeconds).forEach(v => durationErrors.set(v.id, true));
        showError('動画時間を取得できません: ' + error.message);
      } finally {
        durationBusy = false;
        render();
        if (quest.items.some(v => !v.durationSeconds && !durationErrors.has(v.id))) scheduleDurations();
      }
    }
    function renderPhase() {
      const locked = quest.phase === 'locked' && quest.lockedUntil > Date.now();
      document.body.classList.toggle('site-locked', locked);
      els.cooldown.hidden = !locked;
      els.app.inert = locked;
      els.planning.hidden = quest.phase !== 'planning';
      els.catalog.hidden = quest.phase !== 'planning';
      els.watchArea.hidden = quest.phase !== 'running';
      if (locked) {
        const seconds = Math.max(0, Math.ceil((quest.lockedUntil - Date.now()) / 1000));
        els.lockRemaining.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
        els.unlockTime.textContent = clockTime(quest.lockedUntil) + ' に解除';
      }
      if (quest.phase === 'running') {
        const video = quest.items[quest.index];
        els.playerProgress.textContent = (quest.index + 1) + ' / ' + quest.items.length + ' 本';
        els.playerTitle.textContent = video.title;
        els.playerMeta.textContent = formatDuration(video.durationSeconds);
      }
    }
    function startQuest() {
      if (quest.phase !== 'planning' || !quest.items.length || quest.items.some(v => !v.durationSeconds) || durationBusy) return;
      quest.phase = 'running';
      quest.index = 0;
      quest.checkpoint = 0;
      if (!saveQuest()) { quest.phase = 'planning'; return; }
      showError('');
      renderPhase();
      els.watchArea.scrollIntoView({ behavior:'auto', block:'start' });
      resumeQuest();
    }
    function loadPlayerAPI() {
      if (window.YT?.Player) return Promise.resolve();
      if (playerAPI) return playerAPI;
      playerAPI = new Promise((resolve, reject) => {
        let finished = false;
        const timer = window.setTimeout(() => fail(), 15000);
        function fail() {
          if (finished) return;
          finished = true;
          window.clearTimeout(timer);
          playerAPI = null;
          reject(new Error('YouTubeプレイヤーに接続できません。再開ボタンで再試行してください。'));
        }
        window.onYouTubeIframeAPIReady = () => {
          if (finished) return;
          finished = true;
          window.clearTimeout(timer);
          resolve();
        };
        document.getElementById('youtube-api')?.remove();
        const script = document.createElement('script');
        script.id = 'youtube-api';
        script.src = 'https://www.youtube.com/iframe_api';
        script.onerror = fail;
        document.head.appendChild(script);
      });
      return playerAPI;
    }
    async function resumeQuest() {
      if (quest.phase !== 'running' || loadingPlayer) return;
      if (player && !playerReady) return;
      if (playerReady && player) {
        player.playVideo();
        return;
      }
      loadingPlayer = true;
      els.resumeQuest.disabled = true;
      els.playerMessage.textContent = 'プレイヤーに接続中';
      try {
        await loadPlayerAPI();
        if (quest.phase !== 'running') return;
        const origin = /^https?:$/.test(location.protocol) ? location.origin : undefined;
        player = new window.YT.Player('playerMount', {
          width: '100%', height: '100%',
          playerVars: { playsinline: 1, autoplay: 1, rel: 0, origin },
          events: {
            onReady: event => {
              if (quest.phase !== 'running') { event.target.destroy(); return; }
              playerReady = true;
              const frame = event.target.getIframe();
              frame.classList.add('player-frame');
              frame.setAttribute('title', 'YouTube クエスト再生');
              frame.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture');
              frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
              loadCurrentVideo();
            },
            onStateChange: onPlayerState,
            onError: () => {
              hasPlayed = false;
              els.playerMessage.textContent = 'この動画を再生できません。同じ動画を再読み込みできます。';
              els.retryPlayer.hidden = false;
              els.resumeQuest.hidden = true;
            },
            onAutoplayBlocked: () => {
              els.playerMessage.textContent = '自動再生が制限されました。再生を再開してください。';
              els.resumeQuest.hidden = false;
            }
          }
        });
      } catch (error) {
        els.playerMessage.textContent = error.message;
      } finally {
        loadingPlayer = false;
        els.resumeQuest.disabled = false;
      }
    }
    function currentVideoMatches() {
      return quest.phase === 'running' && playerReady && player?.getVideoData?.().video_id === quest.items[quest.index].id;
    }
    function loadCurrentVideo() {
      if (!playerReady || quest.phase !== 'running') return;
      hasPlayed = false;
      handledEnd = false;
      sampleTime = Date.now();
      samplePosition = quest.checkpoint;
      els.retryPlayer.hidden = true;
      els.resumeQuest.hidden = false;
      els.playerMessage.textContent = '';
      renderPhase();
      player.loadVideoById({ videoId: quest.items[quest.index].id, startSeconds: Math.max(0, quest.checkpoint - 1) });
    }
    function onPlayerState(event) {
      if (!currentVideoMatches()) return;
      if (event.data === 1) {
        hasPlayed = true;
        sampleTime = Date.now();
        samplePosition = player.getCurrentTime();
        els.playerMessage.textContent = '';
        els.resumeQuest.hidden = true;
        els.retryPlayer.hidden = true;
        if (samplePosition > quest.checkpoint + 3) player.seekTo(quest.checkpoint, true);
      } else if (event.data === 0) {
        finishCurrentVideo();
      } else if (event.data === 2) {
        els.resumeQuest.hidden = false;
      }
    }
    // Only continuous playback extends the saved position; a forward seek cannot complete a video.
    function recordProgress(ended = false) {
      if (!hasPlayed || !currentVideoMatches()) return;
      const now = Date.now();
      const position = Number(player.getCurrentTime());
      const elapsed = Math.min(3, Math.max(0, (now - sampleTime) / 1000));
      const rate = Number(player.getPlaybackRate?.()) || 1;
      const allowance = elapsed * rate + 1.5;
      if (Number.isFinite(position) && position <= quest.checkpoint + allowance
          && position - samplePosition <= allowance && (player.getPlayerState() === 1 || ended)) {
        quest.checkpoint = Math.max(quest.checkpoint, position);
      } else if (Number.isFinite(position) && position > quest.checkpoint + allowance) {
        player.seekTo(quest.checkpoint, true);
      }
      sampleTime = now;
      samplePosition = position;
      if (now - lastProgressSave >= 4000) { saveQuest(); lastProgressSave = now; }
    }
    function finishCurrentVideo() {
      if (handledEnd || !hasPlayed || !currentVideoMatches()) return;
      recordProgress(true);
      const actualDuration = Number(player.getDuration()) || quest.items[quest.index].durationSeconds;
      const tolerance = Math.min(2, actualDuration * .02);
      if (quest.checkpoint < actualDuration - tolerance) {
        els.playerMessage.textContent = '未視聴の位置から再開します。';
        player.seekTo(quest.checkpoint, true);
        player.playVideo();
        return;
      }
      handledEnd = true;
      state.watched.add(quest.items[quest.index].id);
      saveState();
      if (quest.index + 1 < quest.items.length) {
        quest.index += 1;
        quest.checkpoint = 0;
        saveQuest();
        loadCurrentVideo();
      } else {
        beginCooldown();
      }
    }
    function destroyPlayer() {
      if (player) { try { player.destroy(); } catch {} }
      player = null;
      playerReady = false;
      hasPlayed = false;
      handledEnd = false;
      if (!document.getElementById('playerMount')) {
        const mount = document.createElement('div');
        mount.id = 'playerMount';
        els.watchArea.querySelector('.player-panel').appendChild(mount);
      }
    }
    function beginCooldown() {
      if (quest.phase !== 'running') return;
      quest = { ...emptyQuest(), phase:'locked', lockedUntil: Date.now() + COOLDOWN_MS };
      try { localStorage.setItem(LOCK_KEY, String(quest.lockedUntil)); } catch {}
      saveQuest();
      destroyPlayer();
      showError('');
      renderPhase();
      els.lockTitle.focus();
    }
    function tick() {
      if (quest.phase === 'locked') {
        if (Date.now() >= quest.lockedUntil) {
          quest = emptyQuest();
          saveQuest();
          try { localStorage.removeItem(LOCK_KEY); } catch {}
          renderPhase();
          render();
          els.startQuest.focus();
          scheduleAutoFetch();
        } else renderPhase();
      } else if (quest.phase === 'running') {
        if (playerReady && player?.getPlayerState?.() === 1) {
          if (!currentVideoMatches()) loadCurrentVideo();
          else recordProgress();
        }
      } else if (quest.items.length) {
        renderQueue();
      }
    }
    function clearLegacyCaches() {
      LEGACY_CACHE_KEYS.forEach(key => localStorage.removeItem(key));
    }

    function saveVideoCache(updateTimestamp = true) {
      if (updateTimestamp) lastCacheSavedAt = new Date().toISOString();
      const payload = () => JSON.stringify({
        savedAt: lastCacheSavedAt,
        archiveComplete,
        nextPageToken: archiveNextPageToken,
        videos: allVideos
      });

      try {
        localStorage.setItem(CACHE_KEY, payload());
        return true;
      } catch {
        allVideos = allVideos.map(video => ({ ...video, description: '' }));
        try {
          localStorage.setItem(CACHE_KEY, payload());
          return true;
        } catch {
          return false;
        }
      }
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(new Date(value));
    }

    function setLoading(next) {
      loading = next;
      els.refresh.disabled = next;
      els.saveKey.disabled = next;
      els.refresh.classList.toggle('loading', next);
      els.saveKey.classList.toggle('loading', next);
    }

    function showError(message) {
      els.errorBox.textContent = message;
      els.errorBox.classList.toggle('hidden', !message);
    }

    function getApiKey() {
      return els.apiKey.value.trim() || localStorage.getItem(STORAGE_KEY) || '';
    }

    function saveApiKey() {
      const key = els.apiKey.value.trim();
      if (key) {
        localStorage.setItem(STORAGE_KEY, key);
        els.setup.classList.add('hidden');
      }
      return key;
    }

    async function apiGet(path, params) {
      const url = new URL(`https://www.googleapis.com/youtube/v3/${path}`);
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') {
          url.searchParams.set(key, value);
        }
      });
      const response = await fetch(url);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const reason = data.error?.message || `${response.status} ${response.statusText}`;
        throw new Error(reason);
      }
      return data;
    }

    async function fetchVideos() {
      if (loading || quest.phase !== 'planning') return;
      const apiKey = getApiKey();
      if (!apiKey) {
        els.setup.classList.remove('hidden');
        showError('YouTube Data API キーを入力してください。');
        return;
      }

      setLoading(true);
      const hasCache = allVideos.length > 0;
      const canStopAtCache = hasCache && archiveComplete;
      const isArchiveResume = !archiveComplete && Boolean(archiveNextPageToken);
      const cachedIds = new Set(allVideos.map(video => video.id));
      showError('');
      try {
        let pageToken = isArchiveResume ? archiveNextPageToken : '';
        let reachedBeforeMinDate = false;
        let reachedCachedVideo = false;
        const videos = [];
        let firstPageReady = false;

        while (!reachedBeforeMinDate) {
          const data = await apiGet('playlistItems', {
            part: 'snippet,contentDetails',
            playlistId: UPLOADS_PLAYLIST_ID,
            maxResults: 50,
            pageToken,
            key: apiKey
          });

          for (const item of data.items || []) {
            const publishedAt = item.contentDetails?.videoPublishedAt || item.snippet?.publishedAt;
            if (!publishedAt) continue;
            const publishedDate = new Date(publishedAt);
            if (publishedDate < MIN_DATE) {
              reachedBeforeMinDate = true;
              continue;
            }
            const videoId = item.contentDetails?.videoId || item.snippet?.resourceId?.videoId;
            if (!videoId) continue;
            if (cachedIds.has(videoId)) {
              if (canStopAtCache) reachedCachedVideo = true;
              continue;
            }
            videos.push(normalizeVideo({
              id: videoId,
              title: item.snippet?.title || '無題',
              description: item.snippet?.description || '',
              publishedAt,
              year: publishedDate.getUTCFullYear(),
              thumbnail: item.snippet?.thumbnails?.maxres?.url
                || item.snippet?.thumbnails?.standard?.url
                || item.snippet?.thumbnails?.high?.url
                || item.snippet?.thumbnails?.medium?.url
                || item.snippet?.thumbnails?.default?.url
                || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
            }));
            cachedIds.add(videoId);
          }

          allVideos = dedupe([...videos, ...allVideos])
            .sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
          const nextPageToken = data.nextPageToken || '';
          if (!canStopAtCache) {
            archiveComplete = reachedBeforeMinDate || !nextPageToken;
            archiveNextPageToken = archiveComplete ? '' : nextPageToken;
          }
          saveVideoCache();

          if (!firstPageReady) {
            firstPageReady = true;
            visibleLimit = PAGE_SIZE;
            populateYears();
            render();
            els.setup.classList.add('hidden');
          }

          pageToken = nextPageToken;
          if (!pageToken || (canStopAtCache && reachedCachedVideo)) break;
        }

        archiveComplete = archiveComplete || reachedBeforeMinDate || !pageToken;
        if (archiveComplete) archiveNextPageToken = '';
        saveVideoCache(false);
        populateYears();
        render();
      } catch (error) {
        showError(`取得に失敗しました: ${error.message}`);
      } finally {
        setLoading(false);
      }
    }

    function normalizeVideo(video) {
      const description = String(video.description || '');
      return {
        id: String(video.id || ''),
        title: String(video.title || '無題'),
        description: description.slice(0, CACHE_DESCRIPTION_LIMIT),
        publishedAt: video.publishedAt,
        durationSeconds: Number(video.durationSeconds) > 0 ? Number(video.durationSeconds) : null,
        year: video.year || new Date(video.publishedAt).getUTCFullYear(),
        thumbnail: video.thumbnail || `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`,
        isShort: Boolean(video.isShort) || inferShort(video)
      };
    }

    function inferShort(video) {
      const text = `${video.title || ''}\n${video.description || ''}`.toLowerCase();
      return /#(?:shorts?|ショート(?:動画)?)(?![A-Za-z0-9_ぁ-んァ-ン一-龯])/i.test(text);
    }

    function dedupe(videos) {
      return Array.from(new Map(videos.map(video => [video.id, video])).values());
    }

    function populateYears() {
      const currentFrom = els.yearFrom.value || '2016';
      const years = allSelectableYears().sort((a, b) => b - a);
      const ascending = [...years].sort((a, b) => a - b);
      const yearOptions = ascending.length ? ascending : [2016];
      const latestYear = Math.max(...yearOptions);
      const previousTo = els.yearTo.value || 'all';
      const currentTo = previousTo !== 'all' && Number(previousTo) <= 2022 && latestYear > Number(previousTo)
        ? 'all'
        : previousTo;
      els.yearFrom.innerHTML = yearOptions.map(year => `<option value="${year}">${year}年から</option>`).join('');
      els.yearTo.innerHTML = '<option value="all">最新まで</option>' + years.map(year => `<option value="${year}">${year}年まで</option>`).join('');
      els.yearFrom.value = [...els.yearFrom.options].some(option => option.value === currentFrom) ? currentFrom : String(yearOptions[0]);
      els.yearTo.value = [...els.yearTo.options].some(option => option.value === currentTo) ? currentTo : 'all';
    }

    function allSelectableYears() {
      const latestDataYear = Math.max(2016, ...availableVideos().map(video => video.year));
      const latestYear = Math.max(new Date().getFullYear(), latestDataYear);
      const years = [];
      for (let year = 2016; year <= latestYear; year += 1) {
        years.push(year);
      }
      return years;
    }

    function filteredVideos() {
      const query = els.query.value.trim().toLowerCase();
      const selectedFrom = Number(els.yearFrom.value || 2016);
      const selectedTo = els.yearTo.value === 'all' ? Infinity : Number(els.yearTo.value);
      const yearFrom = Math.min(selectedFrom, selectedTo);
      const yearTo = Math.max(selectedFrom, selectedTo);
      const library = els.libraryFilter.value;
      const sort = els.sort.value;
      const videos = availableVideos().filter(video => {
        const yearMatch = video.year >= yearFrom && video.year <= yearTo;
        const queryMatch = !query || `${video.title}\n${video.description}`.toLowerCase().includes(query);
        const libraryMatch =
          library === 'all'
          || (library === 'unwatched' && !state.watched.has(video.id))
          || (library === 'watched' && state.watched.has(video.id))
          || (library === 'favorite' && state.favorites.has(video.id))
          || (library === 'later' && state.later.has(video.id));
        return yearMatch && queryMatch && libraryMatch;
      });

      if (sort === 'old') {
        videos.sort((a, b) => new Date(a.publishedAt) - new Date(b.publishedAt));
      } else if (sort === 'title') {
        videos.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
      } else if (sort === 'unwatched') {
        videos.sort((a, b) => Number(state.watched.has(a.id)) - Number(state.watched.has(b.id)) || new Date(b.publishedAt) - new Date(a.publishedAt));
      } else if (sort === 'random') {
        videos.sort((a, b) => seededRank(a.id) - seededRank(b.id));
      } else {
        videos.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
      }
      return videos;
    }

    function availableVideos() {
      return allVideos.filter(video => !video.isShort);
    }

    function seededRank(value) {
      let hash = 0;
      for (let index = 0; index < value.length; index += 1) {
        hash = (hash * 31 + value.charCodeAt(index)) >>> 0;
      }
      return hash;
    }


    function restoreCache() {
      try {
        clearLegacyCaches();
        const key = localStorage.getItem(STORAGE_KEY);
        if (key) { els.apiKey.value = key; els.setup.classList.add('hidden'); }
        const data = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (Array.isArray(data?.videos)) {
          lastCacheSavedAt = data.savedAt || '';
          archiveComplete = Boolean(data.archiveComplete);
          archiveNextPageToken = archiveComplete ? '' : String(data.nextPageToken || '');
          allVideos = data.videos.filter(v => new Date(v.publishedAt) >= MIN_DATE).map(normalizeVideo);
        }
      } catch { showError('保存データの一部を読み込めませんでした。'); }
      populateYears();
      renderPhase();
      render();
      if (quest.phase === 'planning') { scheduleAutoFetch(); scheduleDurations(); }
    }
    function shouldAutoFetch() {
      return quest.phase === 'planning' && !loading && Boolean(getApiKey())
        && (!allVideos.length || !archiveComplete || !lastCacheSavedAt || Date.now() - new Date(lastCacheSavedAt).getTime() > AUTO_REFRESH_MS);
    }
    function scheduleAutoFetch(delay = 500) {
      window.clearTimeout(autoFetchTimer);
      if (shouldAutoFetch()) autoFetchTimer = window.setTimeout(fetchVideos, delay);
    }
    els.grid.addEventListener('click', event => {
      const target = event.target.closest('[data-select]');
      if (target) selectVideo(target.dataset.select);
    });
    els.questList.addEventListener('click', event => {
      const target = event.target.closest('[data-queue]');
      if (target) changeQueue(target.dataset.id, target.dataset.queue);
    });
    els.startQuest.addEventListener('click', startQuest);
    els.resumeQuest.addEventListener('click', resumeQuest);
    els.retryPlayer.addEventListener('click', () => {
      if (quest.phase !== 'running') return;
      destroyPlayer();
      resumeQuest();
    });
    els.retryDurations.addEventListener('click', () => { durationErrors.clear(); loadDurations(); });
    els.saveKey.addEventListener('click', () => {
      saveApiKey();
      durationErrors.clear();
      loadDurations();
      fetchVideos();
    });
    els.refresh.addEventListener('click', fetchVideos);
    [els.query, els.yearFrom, els.yearTo, els.sort, els.libraryFilter].forEach(el => {
      el.addEventListener(el === els.query ? 'input' : 'change', () => { visibleLimit = PAGE_SIZE; render(); });
    });
    els.loadMore.addEventListener('click', () => { visibleLimit += PAGE_SIZE; render(); });
    window.addEventListener('pagehide', () => { if (quest.phase === 'running') { recordProgress(); saveQuest(); } });
    window.addEventListener('storage', event => {
      if (event.key !== QUEST_KEY && event.key !== LOCK_KEY) return;
      const next = readQuest();
      if (next.phase === 'locked' || (quest.phase === 'planning' && next.phase === 'running')) {
        quest = next;
        destroyPlayer();
        renderPhase();
      } else if (next.phase === 'planning' && quest.phase === 'planning') {
        quest = next;
        render();
      }
    });
    document.addEventListener('visibilitychange', tick);
    restoreCache();
    window.setInterval(tick, 1000);

  </script>
</body>
</html>
